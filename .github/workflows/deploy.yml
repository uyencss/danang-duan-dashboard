name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:


jobs:
  deploy-vps:
    name: Deploy to VPS (59.153.245.188)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
          NEXT_PUBLIC_ABLY_KEY: ${{ secrets.NEXT_PUBLIC_ABLY_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_DB_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_DB_TUNNEL_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DIRECTOR_CHAT_ID: ${{ secrets.TELEGRAM_DIRECTOR_CHAT_ID }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 20m
          envs: DATABASE_URL,POSTGRES_PASSWORD,NEXT_PUBLIC_APP_URL,BETTER_AUTH_SECRET,BETTER_AUTH_URL,ABLY_API_KEY,NEXT_PUBLIC_ABLY_KEY,CLOUDFLARE_TUNNEL_TOKEN,CLOUDFLARE_DB_TUNNEL_TOKEN,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,TELEGRAM_BOT_TOKEN,TELEGRAM_DIRECTOR_CHAT_ID
          script: |
            mkdir -p /home/cloud/code-deployments
            cd /home/cloud/code-deployments

            if [ -d "danang-duan-dashboard/.git" ]; then
              cd danang-duan-dashboard
              git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/uyencss/danang-duan-dashboard.git
              git fetch origin master
              git reset --hard origin/master
              git clean -fd -e uploads/ -e logs/
            else
              # Init git in existing dir (preserves Docker-owned uploads/logs)
              mkdir -p danang-duan-dashboard
              cd danang-duan-dashboard
              git init
              git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/uyencss/danang-duan-dashboard.git
              git fetch origin master
              git checkout -f origin/master
              git branch -M master
              git reset --hard origin/master
            fi

            # Recreate the .env file from GitHub Actions Secrets
            cat <<EOF > .env
            BUILD_ID="${{ github.sha }}"
            DATABASE_URL="$DATABASE_URL"
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
            NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL"
            BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET"
            BETTER_AUTH_URL="$BETTER_AUTH_URL"
            ABLY_API_KEY="$ABLY_API_KEY"
            NEXT_PUBLIC_ABLY_KEY="$NEXT_PUBLIC_ABLY_KEY"
            CLOUDFLARE_TUNNEL_TOKEN="$CLOUDFLARE_TUNNEL_TOKEN"
            CLOUDFLARE_DB_TUNNEL_TOKEN="$CLOUDFLARE_DB_TUNNEL_TOKEN"
            SMTP_HOST="$SMTP_HOST"
            SMTP_PORT="$SMTP_PORT"
            SMTP_USER="$SMTP_USER"
            SMTP_PASSWORD="$SMTP_PASSWORD"
            SMTP_FROM="$SMTP_FROM"
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
            TELEGRAM_DIRECTOR_CHAT_ID="$TELEGRAM_DIRECTOR_CHAT_ID"
            EOF

            # Create override to expose Redis port for VPS-B connectivity
            cat <<OVERRIDE > docker-compose.override.yml
            services:
              redis:
                ports:
                  - "6379:6379"
            OVERRIDE

            # Build and deploy locally on this machine (DB host: runs all services)
            docker compose up -d --build web db redis cloudflared cloudflared-db

  deploy-vps-alt:
    name: Deploy to Alt VPS (42.1.67.147) — App Only
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_REMOTE }}
          REDIS_URL: ${{ secrets.REDIS_URL_REMOTE }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
          NEXT_PUBLIC_ABLY_KEY: ${{ secrets.NEXT_PUBLIC_ABLY_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DIRECTOR_CHAT_ID: ${{ secrets.TELEGRAM_DIRECTOR_CHAT_ID }}
        with:
          host: ${{ secrets.VPS_ALT_SSH_HOST }}
          username: ${{ secrets.VPS_ALT_SSH_USER }}
          key: ${{ secrets.VPS_ALT_SSH_KEY }}
          envs: DATABASE_URL,REDIS_URL,NEXT_PUBLIC_APP_URL,BETTER_AUTH_SECRET,BETTER_AUTH_URL,ABLY_API_KEY,NEXT_PUBLIC_ABLY_KEY,CLOUDFLARE_TUNNEL_TOKEN,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,TELEGRAM_BOT_TOKEN,TELEGRAM_DIRECTOR_CHAT_ID
          command_timeout: 20m
          script: |
            mkdir -p /home/uyenuyen/code-deployments
            cd /home/uyenuyen/code-deployments

            if [ -d "danang-duan-dashboard/.git" ]; then
              cd danang-duan-dashboard
              git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/uyencss/danang-duan-dashboard.git
              git fetch origin master
              git reset --hard origin/master
              git clean -fd -e uploads/ -e logs/
            else
              mkdir -p danang-duan-dashboard
              cd danang-duan-dashboard
              git init
              git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/uyencss/danang-duan-dashboard.git
              git fetch origin master
              git checkout -f origin/master
              git branch -M master
              git reset --hard origin/master
            fi

            # Recreate the .env file from GitHub Actions Secrets
            # NOTE: DATABASE_URL uses host.docker.internal to reach VPS-A's DB via SSH tunnel
            # NOTE: REDIS_URL uses host.docker.internal to reach VPS-A's Redis via SSH tunnel
            cat <<EOF > .env
            BUILD_ID="${{ github.sha }}"
            DATABASE_URL="$DATABASE_URL"
            REDIS_URL="$REDIS_URL"
            NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL"
            BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET"
            BETTER_AUTH_URL="$BETTER_AUTH_URL"
            ABLY_API_KEY="$ABLY_API_KEY"
            NEXT_PUBLIC_ABLY_KEY="$NEXT_PUBLIC_ABLY_KEY"
            CLOUDFLARE_TUNNEL_TOKEN="$CLOUDFLARE_TUNNEL_TOKEN"
            SMTP_HOST="$SMTP_HOST"
            SMTP_PORT="$SMTP_PORT"
            SMTP_USER="$SMTP_USER"
            SMTP_PASSWORD="$SMTP_PASSWORD"
            SMTP_FROM="$SMTP_FROM"
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
            TELEGRAM_DIRECTOR_CHAT_ID="$TELEGRAM_DIRECTOR_CHAT_ID"
            EOF

            # Create override: reset depends_on to remove db/redis, route through SSH tunnel
            cat <<OVERRIDE > docker-compose.override.yml
            services:
              web:
                depends_on: !reset
                  init-perms:
                    condition: service_completed_successfully
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                environment:
                  - REDIS_URL=${REDIS_URL}
            OVERRIDE

            # Build and deploy (App Only: no db, no redis, no cloudflared-db)
            docker compose up -d --build web cloudflared
